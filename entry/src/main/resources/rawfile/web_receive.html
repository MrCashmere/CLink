<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>局域网网页传输</title>
<style>
  :root {
    --bg: #0b0f14;
    --card: #161b22;
    --card-2: #1c222b;
    --border: #2b3542;
    --text: #e6edf3;
    --text-dim: #9aa4b2;
    --primary: #0a59f7;
    --primary-2: #3b82f6;
    --ok: #00aa72;
    --danger: #d94838;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans CJK SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff;
  }
  .title { font-size: 17px; font-weight: 600; }
  .subtitle { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .device-banner {
    margin-top: 14px;
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--ok);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 640px; width: 100%; margin: 0 auto; }
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 30px 20px;
    text-align: center;
    background: var(--card);
    transition: border-color .15s, background .15s;
    cursor: pointer;
  }
  .drop-zone.dragover { border-color: var(--primary-2); background: var(--card-2); }
  .drop-ico { font-size: 34px; color: var(--primary-2); }
  .drop-text { margin-top: 10px; font-size: 15px; color: var(--text); }
  .drop-hint { margin-top: 6px; font-size: 12px; color: var(--text-dim); }
  .file-list { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .file-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 13px; text-align: left;
  }
  .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-item .size { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
  .file-item .rm { color: var(--danger); font-size: 16px; padding: 0 4px; cursor: pointer; flex: none; }
  .file-item.pending .name { color: var(--text-dim); }
  .file-item.done { border-color: var(--ok); }
  .file-item.failed { border-color: var(--danger); }
  .file-item .st { font-size: 12px; min-width: 40px; text-align: right; color: var(--text-dim); }
  .file-item.done .st { color: var(--ok); }
  .file-item.failed .st { color: var(--danger); }
  .send-btn {
    margin-top: 18px; width: 100%; height: 46px;
    border: none; border-radius: 12px; cursor: pointer;
    background: var(--primary); color: #fff; font-size: 15px; font-weight: 600;
    transition: opacity .15s, transform .05s;
  }
  .send-btn:disabled { opacity: .45; cursor: default; }
  .send-btn:active:not(:disabled) { transform: scale(.99); }
  .status-area { text-align: center; font-size: 13px; color: var(--text-dim); min-height: 20px; }
  .status-area.err { color: var(--danger); }
  .status-area.ok { color: var(--ok); }
  .note {
    font-size: 12px; color: var(--text-dim); line-height: 1.6;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
  }
  .note b { color: var(--text); }
  .share-section {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  }
  .share-head { display: flex; align-items: center; justify-content: space-between; }
  .share-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .share-refresh {
    font-size: 12px; color: var(--primary-2); cursor: pointer; background: none;
    border: none; padding: 2px 6px;
  }
  .share-empty { margin-top: 10px; font-size: 12px; color: var(--text-dim); }
  .share-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .share-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13px;
  }
  .share-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .share-item .size { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
  .share-item .dl {
    flex: none; font-size: 13px; font-weight: 600; color: #fff; text-decoration: none;
    background: var(--primary); border-radius: 8px; padding: 7px 16px;
  }
  .share-item .dl:active { opacity: .8; }
  @media (max-width: 480px) { main { padding: 14px; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">羊</div>
    <div>
      <div class="title">局域网网页传输</div>
      <div class="subtitle">在浏览器中直接向本机发送文件</div>
    </div>
  </div>
  <div class="device-banner"><span class="dot"></span><span id="deviceName">正在连接本机…</span></div>
</header>
<main>
  <div id="dropZone" class="drop-zone">
    <div class="drop-ico">⬆</div>
    <div class="drop-text">点击选择文件，或将文件拖到这里</div>
    <div class="drop-hint">支持一次选择多个文件；发送前需在本机确认</div>
    <input type="file" id="fileInput" multiple hidden>
    <div id="fileList" class="file-list"></div>
    <button id="sendBtn" class="send-btn" type="button" disabled>发送到本机</button>
  </div>
  <div id="status" class="status-area"></div>
  <div class="share-section">
    <div class="share-head">
      <div class="share-title">从本机下载文件</div>
      <button id="shareRefresh" class="share-refresh" type="button">刷新</button>
    </div>
    <div id="shareEmpty" class="share-empty">本机暂未开放可下载文件</div>
    <div id="shareList" class="share-list"></div>
  </div>
  <div class="note">
    使用说明：<br>
    1. 本机（收到文件的设备）保持此页面所在应用已打开，并能正常接收。<br>
    2. 在 <b>同一局域网</b> 内打开本链接，选择文件后点「发送到本机」。<br>
    3. 本机弹窗确认后，文件即传输到本机存储中。<br>
    4. 反之，本机若在 App 内选择文件「发送文件到网页端」，也可在上方列表中下载。<br>
    <span style="opacity:.8">注意：若提示连接失败，请确认两设备在同一 Wi-Fi 网络，且手机未开启拦截。</span>
  </div>
</main>
<script>
(function () {
  'use strict';
  var API_BASE = '/api/localsend/v2';
  var dropZone = document.getElementById('dropZone');
  var fileInput = document.getElementById('fileInput');
  var fileList = document.getElementById('fileList');
  var sendBtn = document.getElementById('sendBtn');
  var statusEl = document.getElementById('status');
  var deviceNameEl = document.getElementById('deviceName');
  var shareList = document.getElementById('shareList');
  var shareEmpty = document.getElementById('shareEmpty');
  var shareRefreshBtn = document.getElementById('shareRefresh');

  var pending = [];        // { id, file, itemEl, el }
  var sessionId = '';
  var fileTokens = {};     // id -> token
  var sending = false;

  function setStatus(text, kind) {
    statusEl.textContent = text || '';
    statusEl.className = 'status-area' + (kind ? ' ' + kind : '');
  }

  function fmtSize(n) {
    if (n >= 1024 * 1024 * 1024) return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
    if (n >= 1024) return Math.floor(n / 1024) + ' KB';
    return n + ' B';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  async function fetchInfo() {
    var r = await fetch(API_BASE + '/info');
    if (!r.ok) throw new Error('本机未响应');
    return r.json();
  }

  function loadInfo() {
    fetchInfo().then(function (info) {
      deviceNameEl.textContent = (info.alias ? info.alias : '本机') + ' · 可接收文件';
    }).catch(function () {
      deviceNameEl.textContent = '本机未响应，请确认应用已打开';
    });
  }
  loadInfo();

  function renderShares(files) {
    if (!files || !files.length) {
      shareList.innerHTML = '';
      shareEmpty.style.display = 'block';
      return;
    }
    shareEmpty.style.display = 'none';
    var html = '';
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      var url = API_BASE + '/share/download?id=' + encodeURIComponent(f.id);
      html += '<div class="share-item">' +
        '<span class="name" title="' + esc(f.name) + '">' + esc(f.name) + '</span>' +
        '<span class="size">' + fmtSize(f.size) + '</span>' +
        '<a class="dl" href="' + url + '" download="' + esc(f.name) + '">下载</a>' +
        '</div>';
    }
    shareList.innerHTML = html;
  }

  function loadShares() {
    fetch(API_BASE + '/share/list').then(function (r) {
      return r.json();
    }).then(function (data) {
      renderShares((data && data.files) || []);
    }).catch(function () {
      shareList.innerHTML = '';
      shareEmpty.style.display = 'block';
    });
  }
  loadShares();
  if (shareRefreshBtn) { shareRefreshBtn.addEventListener('click', loadShares); }
  setInterval(loadShares, 8000);

  function renderList() {
    fileList.innerHTML = '';
    pending.forEach(function (p) {
      var item = document.createElement('div');
      item.className = 'file-item';
      item.innerHTML =
        '<span class="name" title="' + esc(p.file.name) + '">' + esc(p.file.name) + '</span>' +
        '<span class="size">' + fmtSize(p.file.size) + '</span>' +
        '<span class="st">' + (p.stateDesc || '') + '</span>' +
        '<span class="rm" title="移除">×</span>';
      item.querySelector('.rm').addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (sending) return;
        pending = pending.filter(function (x) { return x.id !== p.id; });
        p.removed = true;
        renderList();
        updateSendBtn();
      });
      p.itemEl = item;
      p.stateEl = item.querySelector('.st');
      fileList.appendChild(item);
    });
    updateSendBtn();
  }

  function updateSendBtn() {
    sendBtn.disabled = sending || pending.length === 0 || pending.some(function (p) { return p.removed; });
  }

  function addFiles(files) {
    Array.prototype.forEach.call(files, function (f) {
      // 防止浏览器重复选择同一文件（如点击「发送到本机」冒泡打开选择器后再次选择）导致同一
      // 文件被重复加入待发送列表、进而重复上传。
      var dup = pending.some(function (p) {
        return !p.removed && p.file.name === f.name && p.file.size === f.size;
      });
      if (dup) return;
      pending.push({ id: 'f' + pending.length + '-' + Date.now().toString(36), file: f });
    });
    renderList();
  }

  function onFilesChosen() {
    if (fileInput.files.length) {
      addFiles(fileInput.files);
      fileInput.value = '';
    }
  }

  // 仅当点击的是 dropZone 本身的提示区时才打开选择器；点按钮或文件列表行不触发，
  // 避免「发送到本机」按钮的点击冒泡到 dropZone 再次打开文件选择器（造成重复选文件/重复上传）。
  dropZone.addEventListener('click', function (e) {
    if (e.target && e.target.closest && e.target.closest('button')) return;
    if (e.target && e.target.closest && e.target.closest('.file-item')) return;
    fileInput.click();
  });
  fileInput.addEventListener('change', onFilesChosen);
  ['dragenter', 'dragover'].forEach(function (ev) {
    dropZone.addEventListener(ev, function (e) { e.preventDefault(); dropZone.classList.add('dragover'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    dropZone.addEventListener(ev, function (e) { e.preventDefault(); dropZone.classList.remove('dragover'); });
  });
  dropZone.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      addFiles(e.dataTransfer.files);
    }
  });

  function senderAlias() {
    var ua = navigator.userAgent || '';
    if (/Android/i.test(ua)) return 'Android 浏览器';
    if (/iPhone|iPad|iPod/i.test(ua)) return 'iPhone 浏览器';
    if (/Windows/i.test(ua)) return 'Windows 浏览器';
    if (/Mac/i.test(ua)) return 'macOS 浏览器';
    if (/Linux/i.test(ua)) return 'Linux 浏览器';
    return '浏览器';
  }

  function fileTypeByName(name) {
    var lower = name.toLowerCase();
    if (/\.(jpg|jpeg|png|gif|webp|bmp|heic|svg)$/.test(lower)) return 'image';
    if (/\.(mp4|mkv|mov|avi|webm|3gp)$/.test(lower)) return 'video';
    if (/\.(txt|md|json|csv|xml|html|log)$/.test(lower)) return 'text';
    if (/\.pdf$/.test(lower)) return 'pdf';
    if (/\.apk$/.test(lower)) return 'apk';
    return 'other';
  }

  function buildFilesMap(list) {
    var out = {};
    list.forEach(function (p) {
      out[p.id] = {
        fileName: p.file.name,
        size: p.file.size,
        fileType: fileTypeByName(p.file.name),
        preview: ''
      };
    });
    return out;
  }

  function postSendRequest(filesMap, pin) {
    var body = {
      info: {
        alias: senderAlias(),
        deviceModel: 'Web Browser',
        deviceType: 'desktop',
        fingerprint: 'web',
        port: 0,
        protocol: 'http',
        download: false,
        version: '2.0',
        discoverable: true,
        announce: true
      },
      files: filesMap
    };
    var url = API_BASE + '/send-request' + (pin ? '?pin=' + encodeURIComponent(pin) : '');
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (r.status === 401) { var e = new Error('需要PIN'); e.code = 401; throw e; }
      if (r.status === 429) { var e2 = new Error('PIN重试次数过多'); e2.code = 429; throw e2; }
      if (r.status === 403) { var e3 = new Error('本机拒绝了本次传输'); e3.code = 403; throw e3; }
      if (r.status !== 200) { var e4 = new Error('发起传输失败(' + r.status + ')'); e4.code = r.status; throw e4; }
      return r.json();
    });
  }

  function uploadOne(p, token) {
    var url = API_BASE + '/upload?sessionId=' + encodeURIComponent(sessionId) +
      '&fileId=' + encodeURIComponent(p.id) + '&token=' + encodeURIComponent(token);
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', url);
      xhr.setRequestHeader('Content-Type', 'application/octet-stream');
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable && p.stateEl) {
          var pct = Math.floor(e.loaded / e.total * 100);
          p.stateEl.textContent = pct + '%';
          p.stateDesc = pct + '%';
        }
      };
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) { resolve(); }
        else { reject(new Error('上传失败(' + xhr.status + ')')); }
      };
      xhr.onerror = function () { reject(new Error('网络错误')); };
      xhr.send(p.file);
    });
  }

  function resetToIdle() {
    pending.forEach(function (p) {
      if (!p.removed) { p.stateDesc = ''; }
    });
    renderList();
  }

  async function startSend() {
    if (sending) return;
    var list = pending.filter(function (p) { return !p.removed; });
    if (!list.length) return;
    sending = true;
    updateSendBtn();
    setStatus('正在请求本机确认…');
    list.forEach(function (p) { p.itemEl.classList.add('pending'); p.stateEl.textContent = '等待确认'; });

    var filesMap = buildFilesMap(list);
    var resp = null;
    var pinPrompted = false;
    var lastPin = '';
    var fatal = null;
    while (true) {
      try {
        resp = await postSendRequest(filesMap, lastPin);
        break;
      } catch (e) {
        if (e.code === 401 && !pinPrompted) {
          pinPrompted = true;
          var pin = window.prompt('本机设置了接收PIN，请输入PIN：');
          if (pin === null || !pin.trim()) { fatal = new Error('已取消传输'); break; }
          lastPin = pin.trim();
          continue;
        }
        fatal = e;
        break;
      }
    }
    if (fatal) {
      setStatus(fatal.message, 'err');
      resetToIdle();
      sending = false;
      updateSendBtn();
      return;
    }
    if (!resp) {
      setStatus('发起传输失败', 'err');
      resetToIdle();
      sending = false;
      updateSendBtn();
      return;
    }

    sessionId = resp.sessionId || '';
    fileTokens = (resp.files && typeof resp.files === 'object') ? resp.files : {};
    var sharedToken = resp.token || '';

    setStatus('本机已确认，开始传输…');
    var okCount = 0;
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var tok = fileTokens[p.id] || sharedToken;
      if (!tok) { p.itemEl.classList.add('failed'); p.stateEl.textContent = '无凭证'; continue; }
      p.stateEl.textContent = '0%';
      try {
        await uploadOne(p, tok);
        p.itemEl.classList.add('done'); p.stateEl.textContent = '✓'; p.stateDesc = '';
        okCount += 1;
      } catch (e) {
        p.itemEl.classList.add('failed'); p.stateEl.textContent = '✗'; p.stateDesc = '';
      }
    }
    if (okCount === list.length) {
      setStatus('全部 ' + list.length + ' 个文件已发送到本机', 'ok');
    } else {
      setStatus('已发送 ' + okCount + '/' + list.length + ' 个文件，部分失败', 'err');
    }
    sending = false;
    updateSendBtn();
    sessionId = '';
    fileTokens = {};
  }

  sendBtn.addEventListener('click', function (ev) { ev.stopPropagation(); startSend(); });
})();
</script>
</body>
</html>
