[package]
name = "mta_core"
version = "1.18.1"
edition = "2021"
description = "LocalSend Rust core NAPI bridge for HarmonyOS"

[lib]
crate-type = ["cdylib", "lib"]
path = "rust/lib.rs"

[features]
default = ["napi"]
napi = ["dep:napi-ohos", "dep:napi-derive-ohos", "dep:napi-build-ohos", "dep:tracing-log"]

[dependencies]
localsend = { path = "cert_support" }

napi-ohos = { version = "1.2", default-features = false, features = [
  "napi6",
  "serde-json",
  "tokio",
  "async",
  "tokio_rt",
  "tokio_macros",
  "error_anyhow",
], optional = true }
napi-derive-ohos = { version = "1.2", optional = true }

anyhow = "1"
# 仅用于 Web 分享下载路径的 libc::dup（复制 fd 副本供单次下载消费）
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
log = "0.4"
thiserror = "1"

if-addrs = "0.15"
tracing-log = { version = "0.2", optional = true }

x509-parser = "0.16"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }

uuid = { version = "1", features = ["v4"] }

# ── MTA 发送端 TLS/WS/ZIP 服务器依赖 ──
# 单 TLS 端口同时承载 WebSocket 升级与 HTTPS 下载；证书复用核心 rcgen 运行时生成。
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body = "1"
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# 接收端 Rust 主导下载：直接发起 HTTPS 请求（跳过服务端证书校验）并流式读取响应体。
# 版本与特性对齐 vendored core（`localsend` 的 http feature 已引入同一版本），
# `rustls-no-provider` 需调用方安装 crypto provider（ring）。
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
rustls-pemfile = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# 发送端流式写出 ZIP 需自行计算条目 CRC32；接收端流式解压需按 ZIP 压缩方法区分处理
# （time 特性用于按源文件修改时间编码 ZIP 条目时间——MTA 链路唯一可承载文件时间的标准位）
crc32fast = "1"
flate2 = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
# 发送端流式 ZIP 写出：8.x 提供 ZipWriter::new_stream()（无 Seek 流式模式），
# ZIP64 由库自动处理；deflate-flate2 复用现有 flate2 后端（不引入第二个压缩实现）。
# 注：MTA 发送不再自算 CRC（与 EasyShare 行为对齐，库在写出后自动计算）。
zip = { version = "8.6", default-features = false, features = ["deflate-flate2", "time"] }

[build-dependencies]
napi-build-ohos = { version = "1.2", optional = true }

[dev-dependencies]
# 测试用：以标准 seek 读取器校验流式写出的 ZIP 是否合法（与 [dependencies] 同版本）
zip = { version = "8.6", default-features = false, features = ["deflate-flate2", "time"] }

# TLS 自签名证书的 RSA 密钥生成耗时与优化等级强相关：unoptimized 下单次
# 2048 位生成约 13s（同步阻塞调用方线程），opt-level = 3 下约 0.06s。
# 仅对这两个第三方密码学 crate 单独开优化，项目自身代码保持 unoptimized
# 以保留调试体验。
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
lto = true
opt-level = "s"
strip = true
